<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#16243F"/>
      <stop offset="100%" stop-color="#0C1524"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- app mark -->
  <g transform="translate(96,148) scale(1.58)">
    <rect width="108" height="108" rx="24" fill="#1D3557"/>
    <g fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M34,26 L74,26 Q86,26 86,38 L86,62 Q86,74 74,74 L52,74 L38,88 L38,74 L34,74 Q22,74 22,62 L22,38 Q22,26 34,26 Z"/>
      <path d="M38,50 L70,50"/>
      <path d="M60,40 L70,50 L60,60"/>
    </g>
  </g>

  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
    <text x="360" y="212" fill="#FFFFFF" font-size="84" font-weight="700">OTP Relay</text>

    <!-- SVG has no text wrapping, so the tagline is split by hand -->
    <text x="360" y="272" fill="#8FA6C4" font-size="29" font-style="italic">
      For when someone you trust needs an OTP
    </text>
    <text x="360" y="311" fill="#8FA6C4" font-size="29" font-style="italic">
      and you would rather not stop what you are doing.
    </text>

    <text x="360" y="386" fill="#E6EDF7" font-size="34">Forward OTP texts to one person, for a set time.</text>

    <!-- duration marks, matching the app palette -->
    <g font-size="26" fill="#C8D6EA">
      <circle cx="373" cy="446" r="10" fill="#21A179"/><text x="395" y="455">5 min</text>
      <circle cx="519" cy="446" r="10" fill="#2D7DD2"/><text x="541" y="455">15 min</text>
      <circle cx="678" cy="446" r="10" fill="#F5A623"/><text x="700" y="455">30 min</text>
      <circle cx="843" cy="446" r="10" fill="#C2185B"/><text x="865" y="455">1 hour</text>
    </g>

    <text x="360" y="512" fill="#6F86A6" font-size="28">
      No server · No SMS gateway · No network calls
    </text>
    <text x="360" y="553" fill="#6F86A6" font-size="28">Open source · MIT</text>
  </g>
</svg>
